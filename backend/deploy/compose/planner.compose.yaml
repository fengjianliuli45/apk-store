# 计划引擎服务 + 独立 Postgres。生产 Postgres 建议托管 / 独立主机 + 自动备份。
# 用法：docker compose -f backend/deploy/compose/planner.compose.yaml up -d
name: stopwatch-planner

services:
  planner-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${PLANNER_DB_PASSWORD:-planner_dev_pw}
      POSTGRES_DB: planner
    volumes:
      - planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  planner:
    build:
      context: ../../services/planner
    restart: unless-stopped
    depends_on:
      planner-db:
        condition: service_healthy
    environment:
      PLANNER_DATABASE_URL: postgresql+psycopg://planner:${PLANNER_DB_PASSWORD:-planner_dev_pw}@planner-db:5432/planner
      PLANNER_DEVICE_SALT: ${PLANNER_DEVICE_SALT:?set a long random salt in .env}
      PLANNER_CORS_ORIGINS: '["*"]'
    ports:
      - "${PLANNER_PORT:-8080}:8080"

volumes:
  planner_pgdata:
